name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/book-api
  GITOPS_REPO: ${{ github.repository_owner }}/book-api-gitops

jobs:
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build & test with Maven
        run: mvn -B clean package

      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Username length: ${#DH_USER}"
          echo "Token length: ${#DH_TOKEN}"

          if [[ "$DH_USER" == "Gando03" ]]; then
            echo "Username: OK"
          else
            echo "Username: CHECK"
          fi

          if [[ "$DH_TOKEN" == dckr_pat_* ]]; then
            echo "Token format: OK"
          else
            echo "Token format: CHECK"
          fi

          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "Whitespace: FOUND"
          else
            echo "Whitespace: NONE"
          fi

      - name: Test Docker Hub authentication
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "$DH_USER:$DH_TOKEN" \
            --get \
            --data-urlencode "service=registry.docker.io" \
            --data-urlencode "scope=repository:Gando03/book-api:pull,push" \
            https://auth.docker.io/token)

          echo "Docker Hub auth HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Docker Hub authentication failed"
            exit 1
          fi

          echo "Docker Hub authentication successful"
      - name: Test Docker Hub authentication
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          BODY=$(mktemp)

          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -u "$DH_USER:$DH_TOKEN" \
            --get \
            --data-urlencode "service=registry.docker.io" \
            --data-urlencode "scope=repository:Gando03/book-api:pull,push" \
            https://auth.docker.io/token)

          echo "Docker Hub auth HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Authentication error details:"
            cat "$BODY"
            rm -f "$BODY"
            exit 1
          fi

          echo "Docker Hub authentication successful"
          rm -f "$BODY"

      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  update-manifest:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag
        working-directory: gitops
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE}|" overlays/dev/kustomization.yaml
          sed -i "s|newTag: .*|newTag: \"${TAG}\"|" overlays/dev/kustomization.yaml
          cat overlays/dev/kustomization.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: book-api image -> ${{ needs.build-and-push.outputs.tag }}"
          git push
