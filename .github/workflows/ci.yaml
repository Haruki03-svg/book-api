name: Build, Test & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Generate image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test Docker Hub authentication
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          BODY=$(mktemp)
          PAYLOAD=$(jq -n \
            --arg username "$DH_USER" \
            --arg token "$DH_TOKEN" \
            '{identifier: $username, secret: $token}')

          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://hub.docker.com/v2/auth/token)

          echo "Docker Hub auth HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Authentication error details:"
            cat "$BODY"
            rm -f "$BODY"
            exit 1
          fi

          echo "Docker Hub credentials verified successfully"
          rm -f "$BODY"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DH_USER/book-api"
          docker build -t "$IMAGE:${{ steps.vars.outputs.tag }}" .
          docker tag "$IMAGE:${{ steps.vars.outputs.tag }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"
          docker push "$IMAGE:latest"

      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/Haruki03-svg/book-api-gitops.git
          cd book-api-gitops
          sed -i "s|newTag: .*|newTag: ${{ steps.vars.outputs.tag }}|" overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "Update book-api image to ${{ steps.vars.outputs.tag }}" || echo "No changes"
          git push
